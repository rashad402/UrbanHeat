# PINN + training configuration.

features:
  # Order matters — must match models/features.py and inference.
  inputs: [x, y, ndvi, ndbi, albedo, s_down, t_air, rh, wind]
  target: lst          # Land Surface Temperature (Kelvin internally; see models/constants.py)
  normalize: standardize   # fit on TRAIN split only; persist scaler.json

pinn:
  hidden_layers: 6
  hidden_units: 128
  activation: silu     # tanh is the classic PINN choice; silu often trains faster here
  library: pytorch     # "pytorch" (default) or "deepxde" — see plan §9

loss:
  # L = data_mse + lambda * physics_seb_residual_mse
  lambda_physics_start: 0.0
  lambda_physics_max: 1.0
  lambda_ramp_epochs: 50      # gradually turn on physics to avoid it dominating early
  # NOTE: the SEB residual must be NON-degenerate. If LE is defined as the residual,
  # the residual is identically zero. Use an INDEPENDENT LE estimate (Penman-Monteith /
  # Priestley-Taylor from RH) so the physics loss actually constrains T. See plan §8.

training:
  optimizer: adam
  lr: 1.0e-3
  lr_schedule: cosine
  batch_size: 4096
  max_epochs: 500
  early_stopping_patience: 30   # on validation data-loss
  device: auto                  # cuda if available else cpu

checkpoint:
  dir: models/checkpoints
  best: models/checkpoints/pinn_best.pt
  scaler: models/checkpoints/scaler.json

seed: 42
